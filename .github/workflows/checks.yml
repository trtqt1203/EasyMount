name: Windows source checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.9'
      - name: Build desktop source
        run: dotnet build src/EasyMount/EasyMount.csproj -c Release
      - name: Localization and themes
        run: dotnet run --project tests/Localization.Checks.csproj
      - name: Build pinned engine source
        shell: pwsh
        run: ./engine/build-engine.ps1 -WorkDirectory work/engine-source -OutputPath work/engine/rclone.exe
      - name: Core checks with disposable local storage
        run: dotnet run --project tests/EasyMount.Checks.csproj -- work/engine/rclone.exe
      - name: Priority engine integration
        run: python tests/check-pool.py work/engine/rclone.exe
