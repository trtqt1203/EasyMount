name: Windows source checks
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.9'
      - name: Build desktop source
        run: dotnet build src/EasyMount/EasyMount.csproj -c Release
      - name: Signing preparation and unsigned-release rejection
        shell: pwsh
        run: ./tests/check-signing.ps1 -UnsignedAppPath src/EasyMount/bin/Release/net10.0-windows/EasyMount.exe
      - name: Localization and themes
        run: dotnet run --project tests/Localization.Checks.csproj
      - name: Short website gateway boundaries
        run: node tests/check-pages-gateway.mjs
      - name: Build pinned engine source
        shell: pwsh
        run: ./engine/build-engine.ps1 -WorkDirectory work/engine-source -OutputPath work/engine/rclone.exe
      - name: Core checks with disposable local storage
        shell: pwsh
        run: |
          $output = @(dotnet run --project tests/EasyMount.Checks.csproj -- work/engine/rclone.exe)
          $output | Write-Output
          if ($LASTEXITCODE -ne 0 -or -not ($output -match '^RESULT: \d+ checks passed\.')) { throw 'Core check runner did not report its own result.' }
      - name: Priority engine integration
        run: python tests/check-pool.py work/engine/rclone.exe
      - name: Build disposable installer fixture
        shell: pwsh
        run: |
          # Nonfunctional application identity: never publish this test installer.
          '{"drive":{"client_id":"fixture-client-id","client_secret":"fixture-client-secret"}}' | Set-Content "$env:RUNNER_TEMP/oauth-fixture.json"
          ./build-setup.ps1 -EnginePath work/engine/rclone.exe -OAuthClientsPath "$env:RUNNER_TEMP/oauth-fixture.json"
      - name: Verify installer structure
        shell: pwsh
        run: |
          $version = (Select-Xml Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerText
          ./tests/check-installer.ps1 -SetupPath "EasyMount-$version-Setup.exe" -WixPath work/easymount-installer/wix/wix.exe
      - name: Clean Windows install, WinFsp mounts and uninstall
        shell: pwsh
        run: |
          $version = (Select-Xml Directory.Build.props -XPath '/Project/PropertyGroup/Version').Node.InnerText
          ./tests/check-clean-install.ps1 -SetupPath "EasyMount-$version-Setup.exe" -PayloadDirectory work/easymount-build/app
